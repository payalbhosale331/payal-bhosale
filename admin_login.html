<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | AI Resume Screening System</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#0d6efd,#6fb1fc);
}

.login-container{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    width:420px;
    background:white;
    padding:40px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,.25);
    text-align:center;
}

.logo{
    width:90px;
    height:90px;
    margin:auto;
    border-radius:50%;
    background:#0d6efd;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    margin-bottom:20px;
}

.login-box h2{
    color:#0d6efd;
    margin-bottom:10px;
}

.login-box p{
    color:#666;
    margin-bottom:25px;
}

.input-box{
    position:relative;
    margin-bottom:20px;
}

.input-box i{
    position:absolute;
    left:15px;
    top:15px;
    color:#0d6efd;
}

.input-box input{
    width:100%;
    padding:12px 12px 12px 45px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#0d6efd;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#084298;
}

.back{
    margin-top:20px;
}

.back a{
    text-decoration:none;
    color:#0d6efd;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="login-container">

<div class="login-box">

<div class="logo">
<i class="fa-solid fa-user-shield"></i>
</div>

<h2>Admin Login</h2>

<p>Login to access the Admin Dashboard</p>

<form>

<div class="input-box">
<i class="fa-solid fa-envelope"></i>
<input
type="email"
id="adminEmail"
placeholder="Admin Email"
required>
</div>

<div class="input-box">
<i class="fa-solid fa-lock"></i>
<input
type="password"
id="adminPassword"
placeholder="Password"
required>
</div>

<button
type="button"
onclick="adminLogin()">
Admin Login
</button>

</form>

<div class="back">
<a href="/">⬅ Back to Home</a>
</div>

</div>

</div>

<script type="module"
src="{{ url_for('static', filename='script.js') }}">
</script>

</body>
</html>
