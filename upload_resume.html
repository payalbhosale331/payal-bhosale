<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Upload Resume | AI Resume Screening System</title>
<style>
body{ margin:0; font-family:Arial; background:#eef3f8; }
nav{ background:#0d6efd; color:white; display:flex; justify-content:space-between; padding:15px 50px; }
nav a{ color:white; text-decoration:none; font-weight:bold; margin-left:20px; }
.upload-container{ width:650px; margin:50px auto; background:white; padding:35px; border-radius:12px; box-shadow:0 8px 20px rgba(0,0,0,.15); }
h1{ text-align:center; color:#0d6efd; }
label{ font-weight:bold; display:block; margin-top:15px; }
input, select, textarea{ width:100%; padding:12px; margin-top:8px; border:1px solid #ccc; border-radius:6px; font-size:15px; box-sizing:border-box; }
button{ width:100%; margin-top:25px; padding:14px; background:#0d6efd; color:white; border:none; border-radius:6px; font-size:18px; cursor:pointer; }
</style>
</head>
<body>

<nav>
<h2>AI Resume Screening</h2>
<div>
<a href="/dashboard">Dashboard</a>
<a href="/logout">Logout</a>
</div>
</nav>

<div class="upload-container">
<h1>Upload Resume</h1>
<p style="text-align:center;">Upload your resume and let AI analyze your profile.</p>

<form id="resumeForm">

<label>Full Name</label>
<input type="text" name="name" placeholder="Enter Full Name" required>

<label>Email Address</label>
<input type="email" name="email" placeholder="Enter Email" required>

<label>Job Role</label>
<select name="job_role">
<option>Python Developer</option>
<option>Java Developer</option>
<option>Web Developer</option>
<option>Software Engineer</option>
<option>Data Analyst</option>
<option>AI Engineer</option>
</select>

<label>Skills</label>
<textarea name="skills" rows="3" placeholder="Example: Python, HTML, CSS, SQL"></textarea>

<label>Job Description</label>
<textarea name="job_description" rows="4" placeholder="Paste Job Description here..." required></textarea>

<label>Select Resume</label>
<input type="file" name="resume" accept=".pdf,.doc,.docx" required>

<button type="submit">📤 Analyze Resume</button>

</form>

</div> 
  <button type="submit">📤 Analyze Resume</button>

</form>

</div>

<script type="module">

import { db } from "./firebase-config.js";

import {
  collection,
  addDoc
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const form = document.getElementById("resumeForm");

form.addEventListener("submit", async (e) => {

    e.preventDefault();

    const data = {
        name: form.name.value,
        email: form.email.value,
        job_role: form.job_role.value,
        skills: form.skills.value,
        job_description: form.job_description.value,
        resume: form.resume.files[0] ? form.resume.files[0].name : "Not Uploaded",
        createdAt: new Date()
    };

    try {

        await addDoc(collection(db, "resumes"), data);

        alert("Resume Details Saved Successfully!");

        window.location.href = "result.html";

    } catch (err) {

        alert("Error : " + err.message);

    }

});

</script>

</body>
</html>
</body>
</html>
