<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - AI Resume Screening System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-box {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .logo {
            text-align: center;
            font-size: 45px;
            margin-bottom: 8px;
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        .register-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #1e3a8a;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #2563eb;
        }

        .register-btn:disabled {
            background: #888;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .login-link a,
        .home-link {
            color: #1e3a8a;
            font-weight: bold;
            text-decoration: none;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="register-box">

    <div class="logo">🤖</div>

    <h1>Create Account</h1>

    <p class="subtitle">
        Register for AI Resume Screening System
    </p>

    <form id="registerForm">

        <div class="form-group">
            <label>Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >
        </div>

        <div class="form-group">
            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Create password"
                minlength="6"
                required
            >
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm password"
                minlength="6"
                required
            >
        </div>

        <button type="submit" class="register-btn" id="registerBtn">
            Create Account
        </button>

    </form>

    <div id="message"></div>

    <div class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

    <a href="index.html" class="home-link">
        ← Back to Home
    </a>

</div>


<!-- Firebase Registration -->
<script type="module">

    import { auth, database } from "./firebase-config.js";

    import {
        createUserWithEmailAndPassword,
        updateProfile
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

    import {
        ref,
        set
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";


    const registerForm = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const registerBtn = document.getElementById("registerBtn");


    registerForm.addEventListener("submit", async function(event) {

        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword =
            document.getElementById("confirmPassword").value;


        // Password confirmation
        if (password !== confirmPassword) {

            message.innerHTML = "Passwords do not match!";
            message.style.color = "red";

            return;
        }


        // Password length
        if (password.length < 6) {

            message.innerHTML =
                "Password must contain at least 6 characters.";

            message.style.color = "red";

            return;
        }


        registerBtn.disabled = true;
        registerBtn.innerText = "Creating Account...";


        try {

            // Create Firebase Authentication account
            const userCredential =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user = userCredential.user;


            // Save user's display name
            await updateProfile(user, {
                displayName: name
            });


            // Save user information in Realtime Database
            await set(
                ref(database, "users/" + user.uid),
                {
                    uid: user.uid,
                    name: name,
                    email: email,
                    createdAt: new Date().toISOString(),
                    role: "student"
                }
            );


            message.innerHTML =
                "Registration successful! Redirecting...";

            message.style.color = "green";


            // Redirect to login
            setTimeout(function() {

                window.location.href = "login.html";

            }, 1500);


        } catch (error) {

            console.error("Firebase Registration Error:", error);


            let errorMessage =
                "Registration failed. Please try again.";


            if (error.code === "auth/email-already-in-use") {

                errorMessage =
                    "This email is already registered.";

            } else if (error.code === "auth/invalid-email") {

                errorMessage =
                    "Please enter a valid email address.";

            } else if (error.code === "auth/weak-password") {

                errorMessage =
                    "Password is too weak. Use at least 6 characters.";

            }


            message.innerHTML = errorMessage;
            message.style.color = "red";


            registerBtn.disabled = false;
            registerBtn.innerText = "Create Account";

        }

    });

</script>

</body>
</html>
