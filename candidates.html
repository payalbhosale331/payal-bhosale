<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Candidates | AI Resume Screening System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #222;
        }

        .navbar {
            background: #1e3a8a;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            font-size: 21px;
        }

        .back-btn {
            background: white;
            color: #1e3a8a;
            padding: 9px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .heading h1 {
            color: #1e3a8a;
            margin-bottom: 8px;
        }

        .heading p {
            color: #666;
        }

        .table-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th {
            background: #1e3a8a;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            vertical-align: middle;
        }

        tr:hover {
            background: #f8fafc;
        }

        .score {
            background: #dcfce7;
            color: #166534;
            padding: 6px 12px;
            border-radius: 15px;
            font-weight: bold;
        }

        .view-btn {
            background: #1e3a8a;
            color: white;
            text-decoration: none;
            padding: 7px 12px;
            border-radius: 5px;
            display: inline-block;
        }

        .view-btn:hover {
            background: #2563eb;
        }

        .message {
            text-align: center;
            padding: 25px;
            color: #666;
            font-size: 16px;
        }

        .error {
            color: #dc2626;
        }

        footer {
            margin-top: 50px;
            background: #1e3a8a;
            color: white;
            text-align: center;
            padding: 18px;
        }

        @media (max-width: 600px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .container {
                margin: 20px auto;
                padding: 10px;
            }

            .table-box {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <div class="navbar">

        <h2>🤖 AI Resume Screening System</h2>

        <a href="dashboard.html" class="back-btn">
            Dashboard
        </a>

    </div>


    <!-- Main -->
    <div class="container">

        <div class="heading">

            <h1>Candidates List</h1>

            <p>
                View all resumes submitted in the AI Resume Screening System.
            </p>

        </div>


        <div class="table-box">

            <table>

                <thead>
                    <tr>
                        <th>Sr. No.</th>
                        <th>Candidate Name</th>
                        <th>Email</th>
                        <th>Skills</th>
                        <th>Job Role</th>
                        <th>Match Score</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="candidateTable">

                    <tr>
                        <td colspan="7" class="message">
                            Loading candidates...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 AI Resume Screening System |
            Developed by Payal Bhosale |
            AGCE Polytechnic, Satara
        </p>

    </footer>


    <!-- Firebase -->
    <script type="module">

        import { db } from "./firebase-config.js";

        import {
            collection,
            getDocs
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


        // Table body
        const table = document.getElementById("candidateTable");


        // Load candidates from Firestore
        async function loadCandidates() {

            try {

                table.innerHTML = `
                    <tr>
                        <td colspan="7" class="message">
                            Loading candidates...
                        </td>
                    </tr>
                `;


                // Get resumes collection
                const snapshot = await getDocs(
                    collection(db, "resumes")
                );


                // No candidates
                if (snapshot.empty) {

                    table.innerHTML = `
                        <tr>
                            <td colspan="7" class="message">
                                No candidates found in Firestore.
                            </td>
                        </tr>
                    `;

                    return;
                }


                table.innerHTML = "";

                let sr = 1;


                snapshot.forEach((doc) => {

                    const data = doc.data();


                    // Candidate information
                    const name =
                        data.name ||
                        data.fullName ||
                        "N/A";


                    const email =
                        data.email ||
                        "N/A";


                    const skills =
                        data.skills ||
                        "N/A";


                    const jobRole =
                        data.job_role ||
                        data.jobRole ||
                        "N/A";


                    // Match score
                    let matchScore =
                        data.matchScore ??
                        data.match_score ??
                        data.score ??
                        0;


                    // If score is decimal like 0.90
                    if (
                        typeof matchScore === "number" &&
                        matchScore <= 1
                    ) {
                        matchScore = Math.round(
                            matchScore * 100
                        );
                    }


                    // If score is string
                    if (typeof matchScore === "string") {

                        matchScore =
                            matchScore.replace("%", "");

                    }


                    // Create row
                    const row = document.createElement("tr");


                    row.innerHTML = `

                        <td>${sr++}</td>

                        <td>${escapeHTML(name)}</td>

                        <td>${escapeHTML(email)}</td>

                        <td>${escapeHTML(skills)}</td>

                        <td>${escapeHTML(jobRole)}</td>

                        <td>
                            <span class="score">
                                ${escapeHTML(String(matchScore))}%
                            </span>
                        </td>

                        <td>
                            <a
                                href="result.html?id=${encodeURIComponent(doc.id)}"
                                class="view-btn"
                            >
                                View
                            </a>
                        </td>

                    `;


                    table.appendChild(row);

                });


            } catch (error) {

                console.error(
                    "Error loading candidates:",
                    error
                );


                table.innerHTML = `
                    <tr>
                        <td colspan="7" class="message error">
                            Failed to load candidates.
                            <br><br>
                            ${escapeHTML(error.message)}
                        </td>
                    </tr>
                `;

            }

        }


        // Prevent HTML injection
        function escapeHTML(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        // Load data after page is ready
        loadCandidates();

    </script>

</body>
</html>
