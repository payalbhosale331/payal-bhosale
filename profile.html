<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f6f9;
}

header{
    background:#0d6efd;
    color:white;
    padding:15px;
    text-align:center;
}

.container{
    width:90%;
    margin:30px auto;
}

.cards{
    display:flex;
    justify-content:space-between;
    gap:20px;
    margin-bottom:30px;
}

.card{
    flex:1;
    background:white;
    padding:20px;
    text-align:center;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,.2);
}

.card h2{
    color:#0d6efd;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

table th{
    background:#0d6efd;
    color:white;
}

table th,
table td{
    padding:12px;
    border:1px solid #ddd;
    text-align:center;
}

.logout{
    margin-top:20px;
    text-align:center;
}

.logout a{
    background:red;
    color:white;
    padding:10px 20px;
    text-decoration:none;
    border-radius:5px;
}

</style>

</head>
<body>

<header>
<h1>Admin Dashboard</h1>
</header>

<div class="container">

<div class="cards">

<div class="card">
<h2>50</h2>
<p>Total Users</p>
</div>

<div class="card">
<h2>40</h2>
<p>Resumes</p>
</div>

<div class="card">
<h2>28</h2>
<p>Shortlisted</p>
</div>

<div class="card">
<h2>12</h2>
<p>Rejected</p>
</div>

</div>

<h2>Candidate List</h2>

<table>

<tr>
<th>Name</th>
<th>Email</th>
<th>Role</th>
<th>Status</th>
</tr>

<tr>
<td>Payal Bhosale</td>
<td>payal@gmail.com</td>
<td>Python Developer</td>
<td>Shortlisted</td>
</tr>

<tr>
<td>Rahul Patil</td>
<td>rahul@gmail.com</td>
<td>Java Developer</td>
<td>Rejected</td>
</tr>

</table>

<div class="logout">
<a href="/admin_login">Logout</a>
</div>

</div>

</body>
</html>
